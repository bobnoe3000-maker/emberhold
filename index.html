<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0913">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Emberfall</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden; background: #0d0913;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #game {
    position: fixed; inset: 0;
    touch-action: none;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 52%, transparent 64%, rgba(6,4,12,0.32) 100%);
  }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 14px 8px;
    display: flex; align-items: baseline; gap: 14px;
    pointer-events: none; color: #e8e4da;
    text-shadow: 0 1px 0 #0d0913;
  }
  #hud .title { font-size: 13px; letter-spacing: 2px; font-weight: 700; }
  #menuBtn { pointer-events: auto; align-self: center; width: 34px; height: 34px; margin: -6px -4px -6px -6px; border-radius: 8px;
    background: rgba(16,12,22,0.7); border: 1px solid rgba(214,170,98,0.35); color: #e0a85a; font-size: 16px; line-height: 1; }
  #hud .title em { color: #ff9440; font-style: normal; }
  #hud .stat { font-size: 12px; color: #8f8ca4; flex: none; white-space: nowrap; }
  /* the row must fit one phone line: nothing shrinks but the place name (last, with an ellipsis); on a
     phone the wordmark gives its room to the wage line and the sky dial under gold and cinders */
  #hud .stat.place { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  #menuBtn, #hud .title { flex: none; }
  @media (max-width: 479px) { #hud .title { display: none; } }
  #hud .stat b { color: #e8e4da; font-weight: 600; }
  #hud .stat .ember { color: #ff9440; font-style: normal; }
  #hudToast {
    position: fixed; left: 50%; top: 22%;
    transform: translateX(-50%) translateY(6px);
    font-size: 13px; color: #ff9440; letter-spacing: 1px;
    width: max-content; max-width: calc(100vw - 32px); text-align: center;   /* (left: 50% alone squeezed it to half the screen: every long toast wrapped ragged) */
    opacity: 0; transition: opacity .18s, transform .18s;
    pointer-events: none; text-shadow: 0 1px 0 #0d0913; z-index: 10;   /* over the menu sheets: the temple's raise list is open when it speaks */
  }
  #hudToast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* the studio splash, up before any script runs; the boot (src/cutscene/player.js) takes over */
  #bootSplash { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: #050407; color: #d9cdb8; font: 600 12px ui-monospace, Menlo, monospace; letter-spacing: .4em; text-transform: uppercase; }
  #bootSplash .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff8a3a; box-shadow: 0 0 14px #ff8a3a; }
  #hint {
    position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    left: 0; right: 0; text-align: center;
    font-size: 11px; color: #8f8ca4; letter-spacing: 1px;
    pointer-events: none; opacity: .85;
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="vignette"></div>
  <div id="hud">
    <button id="menuBtn" aria-label="Game slots">☰</button>
    <div class="title">EMBER<em>FALL</em></div>
    <div class="stat place">depth <b id="hudDepth">1</b></div>
    <div class="stat">gold <b id="hudGold">0</b></div>
    <div class="stat" aria-label="cinders"><em class="ember">✦</em> <b id="hudEmbers">0</b></div>
    <div class="stat" style="display:none">wood <b id="hudWood">0</b></div>
    <div class="stat" style="display:none">stone <b id="hudStone">0</b></div>
  </div>
  <div id="hudToast"></div>
  <div id="bootSplash"><div class="dot"></div><div>No Game Studios</div></div>
  <div id="hint">drag to move · tap to walk, open &amp; descend</div>
  <!-- vendored, pinned ES modules (src/vendor/README.md); no bundler -->
  <script type="importmap">
  { "imports": {
      "preact": "./src/vendor/preact-10.29.8/preact.module.js",
      "preact/hooks": "./src/vendor/preact-10.29.8/hooks.module.js",
      "htm": "./src/vendor/htm-3.1.1/htm.module.js",
      "htm/preact": "./src/vendor/htm-3.1.1/htm-preact.module.js",
      "inkjs": "./src/vendor/inkjs-2.4.0/ink.mjs"
  } }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
