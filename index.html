<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0913">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Emberhold</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden; background: #0d0913;
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #game {
    position: fixed; inset: 0;
    touch-action: none;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 52%, transparent 64%, rgba(6,4,12,0.32) 100%);
  }
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 8px;
    display: flex; align-items: baseline; gap: 14px;
    pointer-events: none; color: #e8e4da;
    text-shadow: 0 1px 0 #0d0913;
  }
  #hud .title { font-size: 13px; letter-spacing: 2px; font-weight: 700; }
  #hud .title em { color: #ff9440; font-style: normal; }
  #hud .stat { font-size: 12px; color: #8f8ca4; }
  #hud .stat b { color: #e8e4da; font-weight: 600; }
  #hudToast {
    position: fixed; left: 50%; top: 22%;
    transform: translateX(-50%) translateY(6px);
    font-size: 13px; color: #ff9440; letter-spacing: 1px;
    opacity: 0; transition: opacity .18s, transform .18s;
    pointer-events: none; text-shadow: 0 1px 0 #0d0913;
  }
  #hudToast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
  #hint {
    position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    left: 0; right: 0; text-align: center;
    font-size: 11px; color: #8f8ca4; letter-spacing: 1px;
    pointer-events: none; opacity: .85;
  }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="vignette"></div>
  <div id="hud">
    <div class="title">EMBER<em>HOLD</em></div>
    <div class="stat">depth <b id="hudDepth">1</b></div>
    <div class="stat">wood <b id="hudWood">0</b></div>
    <div class="stat">stone <b id="hudStone">0</b></div>
  </div>
  <div id="hudToast"></div>
  <div id="hint">drag to move · tap to gather, open &amp; descend</div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
