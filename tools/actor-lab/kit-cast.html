<!doctype html><html><head><meta charset="utf-8"><title>kit cast</title><style>html,body{margin:0;background:#07080c;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script></head><body>
<script type="module">
// kit-cast.html — our cast in the dungeon kit's room (docs/dungeon-kit-proposal.md §9): the party of three against two
// skeletons, drawn three ways at the game's camera and zoom, so the figures can be chosen by eye on a phone:
//   ?mode=sprite    today's atlases (assets/actors, 56 px figures) as Luminati stands them: a lit card facing the
//                   camera, nearest-sampled. ?pr=1.25 is Luminati's render resolution today (Game.js maxPixelRatio).
//   ?mode=sprite&atlas=<dir>&smooth   a re-bake at another size (BAKE_PX=112 BAKE_OUT=<dir> bake.cjs …), sampled smooth
//   ?mode=3d        the same variants as models (lab.js labActor: heroic proportions, faces, gear, recolours), posed
//                   at the same frame of the same clip, lit by the room and casting shadows
// ?fill=0.4 the share of the cards' self-light the models get · ?pr= the canvas's pixel ratio (default the device's) · ?pitch=30. Needs tools/kit/fetch.sh and fetch-assets.sh.
import * as THREE from 'three';
import './lab.js';
import { buildRoom, emberCamera } from '../kit/room.js';
document.querySelectorAll('canvas').forEach((c) => c.remove());          // (lab.js's own bake canvas)
const q = new URLSearchParams(location.search), MODE = q.get('mode') || 'sprite', ATLAS = q.get('atlas') || '../../assets/actors/';
const FILL = +(q.get('fill') ?? 0.4), SMOOTH = q.has('smooth'), PR = +(q.get('pr') || devicePixelRatio), PITCH = +(q.get('pitch') || 30);
const W = innerWidth, H = innerHeight;
const R = new THREE.WebGLRenderer({ antialias: MODE === '3d', preserveDrawingBuffer: true }); R.setPixelRatio(PR); R.setSize(W, H);
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap; R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.05;
R.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(R.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color(0x07080c);
await buildRoom(S, { kit: '../kit/models/', actors: './models/', stand: false });
const C = emberCamera(W, H, 35 * (H / 844), PITCH, new THREE.Vector3(11.5, 0, 11));
const variants = Object.fromEntries((await (await fetch('./variants.json')).json()).map((v) => [v.id, v]));
const bake = Object.fromEntries((await (await fetch('./bake.json')).json()).actors.map((a) => [a.out, a]));
// the fight: the party on the left facing screen-east (atlas row 0), the skeletons on the right facing west (row 4)
const CAST = [
  { out: 'hero_knight', at: [10, 12.4], dir: 0, clip: 'attack', frame: 3 },
  { out: 'hero_cleric', at: [7.2, 13.4], dir: 0, clip: 'idle', frame: 4 },
  { out: 'hero_rogue', at: [11.4, 15.2], dir: 0, clip: 'attack', frame: 2 },
  { out: 'skeleton_warrior', at: [13.2, 9.6], dir: 4, clip: 'attack2', frame: 2 },
  { out: 'skeleton_minion', at: [15.2, 12.2], dir: 4, clip: 'idle', frame: 3 },
];
const east = new THREE.Vector3(1, 0, 0).applyQuaternion(C.quaternion); east.y = 0; east.normalize();
const texCache = {};
// the cards are lit as Luminati lights the game's figures (tools/render3d/world.js): normals leaning 0.6 to the sky
// (SPRITE_OPTS normalUp), and figureGlow's self-light filling the gap between the room's sky light and FIG_LIT 1.6, 0.2 to 1
const lum = (c) => 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b; let skyLit = 0;
S.traverse((o) => { if (o.isHemisphereLight) skyLit += lum(o.color) * o.intensity; if (o.isDirectionalLight) skyLit += lum(o.color) * o.intensity * 0.5; });
const GLOW = Math.min(1, Math.max(0.2, 1.6 - skyLit)), upLocal = new THREE.Vector3(0, 1, 0).applyQuaternion(C.quaternion.clone().invert());
const bent = new THREE.Vector3(0, 0, 1).lerp(upLocal, 0.6).normalize();
for (const c of CAST) {
  const a = bake[c.out], v = variants[a.variant], k = a.clips.find((x) => x.key === c.clip);
  const act = await window.labActor(v);                                // (built either way: its idle height sizes the card)
  const foot = new THREE.Vector3(c.at[0], 0, c.at[1]), face = c.dir === 0 ? east.clone() : east.clone().negate();
  if (MODE === '3d') {
    act.pose(k.clip, c.frame / k.frames);
    act.root.position.copy(foot); act.root.position.y -= act.minY; act.root.rotation.y = Math.atan2(face.x, face.z);
    // the same fill the cards get, at FILL of it (a model catches the torches and the sky as a card can't): ?fill=0 for none
    act.root.traverse((o) => { if (!o.isMesh) return; o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false;
      if (FILL > 0 && o.material.map) { o.material = o.material.clone(); o.material.emissive = new THREE.Color(0xffe9d2); o.material.emissiveMap = o.material.map; o.material.emissiveIntensity = GLOW * FILL; } });
    S.add(act.root); continue;
  }
  // a card from the atlas: the frame at (clip start + frame, dir), its pixels as many world units as the bake's
  const meta = await (await fetch(`${ATLAS}${c.out}.json`)).json(), px = Math.round(meta.ch * 46 / 84);   // (lab.js: H = 84 px at 46)
  const tex = texCache[c.out] ||= await new THREE.TextureLoader().loadAsync(`${ATLAS}${c.out}.alb.png`);
  tex.colorSpace = THREE.SRGBColorSpace;
  if (SMOOTH) { tex.magFilter = THREE.LinearFilter; tex.minFilter = THREE.LinearMipmapLinearFilter; tex.generateMipmaps = true; tex.anisotropy = 4; }
  else { tex.magFilter = tex.minFilter = THREE.NearestFilter; tex.generateMipmaps = false; }
  const col = meta.clips[c.clip].start + c.frame, iw = tex.image.width, ih = tex.image.height, t = tex.clone(); t.needsUpdate = true;
  t.repeat.set(meta.cw / iw, meta.ch / ih); t.offset.set(col * meta.cw / iw, 1 - (c.dir + 1) * meta.ch / ih);
  const upp = act.height / px;                                         // world units a pixel: the bake fits the idle figure to px
  const geo = new THREE.PlaneGeometry(meta.cw * upp, meta.ch * upp), nrm = geo.getAttribute('normal');
  for (let i = 0; i < nrm.count; i++) nrm.setXYZ(i, bent.x, bent.y, bent.z);
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ map: t, alphaTest: 0.5, emissive: 0xffe9d2, emissiveIntensity: GLOW, emissiveMap: t }));
  m.quaternion.copy(C.quaternion);
  // the bake centres the frame on the world point (H/2 − 6) px above the feet, on the figure's axis
  m.position.copy(foot).add(new THREE.Vector3(0, (meta.ch / 2 - 6) * upp, 0));
  const off = (meta.cw / 2 - meta.ax) * upp; m.position.add(new THREE.Vector3(1, 0, 0).applyQuaternion(C.quaternion).multiplyScalar(off));
  S.add(m);
}
R.render(S, C); const info = R.info.render; window.STATS = { calls: info.calls, tris: info.triangles, pr: PR, glow: GLOW }; window.DONE = true;
</script></body></html>
