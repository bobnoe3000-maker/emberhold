<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Emberfall · the world in Luminati (trial)</title>
  <!-- world.js: never opened by itself; the game frames it (src/render3d/hybrid.js, docs/luminati-port-plan.md) -->
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    #app { position: fixed; inset: 0; overflow: hidden; background: #000; }
    #app canvas { display: block; width: 100%; height: 100%; }
    /* none of Luminati's own UI: the game's HUD is over this frame */
    .lu-root, #loading { display: none !important; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./world.js"></script>
</body>
</html>
